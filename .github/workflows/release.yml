name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the crate version matches the tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"
          VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "serde-json-slice") | .version')
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag '${TAG}' does not match serde-json-slice version '$VERSION'"
            exit 1
          fi
          echo "serde-json-slice $VERSION verified against tag ${TAG}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Authenticate to crates.io via trusted publishing
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # A version already on crates.io is skipped, so re-running a release is safe.
          name=serde-json-slice
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version')
          index="https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
          if curl -fsSL "$index" 2>/dev/null | grep -qF "\"vers\":\"${version}\""; then
            echo "$name $version already on crates.io, skipping"
          else
            cargo publish --locked
          fi

      - name: Generate release notes
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -q .body)
          gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
