[package]
name = "serde-json-slice"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A no_std, no-alloc JSON serializer for serde that writes into a caller's buffer and never panics"
repository = "https://github.com/powersemmi/serde-json-slice"
documentation = "https://docs.rs/serde-json-slice"
readme = "README.md"
keywords = ["json", "serde", "no_std", "embedded", "serialization"]
categories = ["encoding", "no-std", "no-std::no-alloc", "embedded"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# Implements the output sink for `Vec<u8>`.
alloc = []

[dependencies]

[dev-dependencies]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
